[project]
name = "a2ui-demo-backend"
version = "0.1.0"
description = "ADK agents that answer with A2UI surfaces over a plain SSE endpoint"
requires-python = ">=3.11"
dependencies = [
    "a2ui-agent-sdk==0.6.0",
    "google-adk==2.9.2",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
